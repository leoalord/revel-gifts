name: question#read_answer is computed and cannot be written
model_file: ../../model.fga
# Expected to FAIL: scripts/test-model.sh asserts the CLI rejects this tuple.

tests:
  - name: direct read_answer tuple
    tuples:
      - user: "user:sam"
        relation: read_answer
        object: question:q1
    check:
      - user: user:sam
        object: question:q1
        assertions:
          read_answer: true
