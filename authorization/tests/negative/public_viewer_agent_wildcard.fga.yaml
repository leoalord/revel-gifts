name: public_viewer must not accept agent:* (it would match disconnected delegations)
model_file: ../../model.fga
# Expected to FAIL: scripts/test-model.sh asserts the CLI rejects this tuple.

tests:
  - name: direct public_viewer tuple
    tuples:
      - user: "agent:*"
        relation: public_viewer
        object: profile:alex
    check:
      - user: agent:deleg-sam-muse
        object: profile:alex
        assertions:
          view_public: true
