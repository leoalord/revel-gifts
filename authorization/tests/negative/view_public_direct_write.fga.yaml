name: view_public is computed and cannot be written
model_file: ../../model.fga
# Expected to FAIL: scripts/test-model.sh asserts the CLI rejects this tuple.

tests:
  - name: direct view_public tuple
    tuples:
      - user: "user:sam"
        relation: view_public
        object: profile:alex
    check:
      - user: user:sam
        object: profile:alex
        assertions:
          view_public: true
