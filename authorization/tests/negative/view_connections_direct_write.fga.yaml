name: view_connections is computed and cannot be written
model_file: ../../model.fga
# Expected to FAIL: scripts/test-model.sh asserts the CLI rejects this tuple.

tests:
  - name: direct view_connections tuple
    tuples:
      - user: "user:sam"
        relation: view_connections
        object: profile:alex
    check:
      - user: user:sam
        object: profile:alex
        assertions:
          view_connections: true
