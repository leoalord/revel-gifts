name: connection accepts users only; agents inherit through user#delegate
model_file: ../../model.fga
# Expected to FAIL: scripts/test-model.sh asserts the CLI rejects this tuple.

tests:
  - name: direct connection tuple
    tuples:
      - user: "agent:deleg-sam-muse"
        relation: connection
        object: profile:alex
    check:
      - user: agent:deleg-sam-muse
        object: profile:alex
        assertions:
          view_connections: true
