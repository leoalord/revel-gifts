name: Revel Gifts authorization model v1
model_file: ../model.fga
# agent:<id> is an agent_delegations.id (one per user and OAuth client pair).
# Agent connect writes agent:<d>#acts_for@user:<u> and user:<u>#delegate@agent:<d>;
# profile#owner_agent is computed (delegate from owner) and never written.

tests:
  - name: owner and connected agent
    description: Owner and the owner's connected agent can use the profile; other users and their agents cannot.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-claude
      - user: agent:deleg-alex-claude
        relation: delegate
        object: user:alex
      - user: user:bob
        relation: owner
        object: profile:bob
      - user: user:bob
        relation: acts_for
        object: agent:deleg-bob-claude
      - user: agent:deleg-bob-claude
        relation: delegate
        object: user:bob
    check:
      - user: user:alex
        object: profile:alex
        assertions:
          owner: true
          contribute: true
          view_only_me: true
      - user: agent:deleg-alex-claude
        object: profile:alex
        assertions:
          owner_agent: true
          contribute: true
          view_only_me: true
      - user: user:bob
        object: profile:alex
        assertions:
          owner: false
          contribute: false
          view_only_me: false
      - user: agent:deleg-bob-claude
        object: profile:alex
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false
    list_objects:
      - user: user:alex
        type: profile
        assertions:
          view_only_me:
            - profile:alex
          contribute:
            - profile:alex
      - user: agent:deleg-alex-claude
        type: profile
        assertions:
          view_only_me:
            - profile:alex
          contribute:
            - profile:alex
      - user: agent:deleg-bob-claude
        type: profile
        assertions:
          view_only_me:
            - profile:bob

  - name: two delegations of the same client
    description: Alex and Sam both connect the same Muse client; each delegation is its own agent object, so Sam's delegate cannot use Alex's profile.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-muse
      - user: agent:deleg-alex-muse
        relation: delegate
        object: user:alex
      - user: user:sam
        relation: owner
        object: profile:sam
      - user: user:sam
        relation: acts_for
        object: agent:deleg-sam-muse
      - user: agent:deleg-sam-muse
        relation: delegate
        object: user:sam
    check:
      - user: agent:deleg-alex-muse
        object: profile:alex
        assertions:
          contribute: true
          view_only_me: true
      - user: agent:deleg-sam-muse
        object: profile:alex
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false
      - user: agent:deleg-sam-muse
        object: profile:sam
        assertions:
          contribute: true
          view_only_me: true
    list_objects:
      - user: agent:deleg-sam-muse
        type: profile
        assertions:
          view_only_me:
            - profile:sam
          contribute:
            - profile:sam

  - name: agent disconnected
    description: Without the delegate tuple (disconnect deletes it) the agent is denied even though acts_for remains; the owner keeps access.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-muse
    check:
      - user: agent:deleg-alex-muse
        object: profile:alex
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false
      - user: user:alex
        object: profile:alex
        assertions:
          contribute: true
          view_only_me: true
    list_objects:
      - user: agent:deleg-alex-muse
        type: profile
        assertions:
          view_only_me: []
          contribute: []

  - name: owner_agent follows the owner
    description: An agent delegated by alex gets owner_agent only on profiles alex owns, not on a profile owned by someone else.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:bob
        relation: owner
        object: profile:bob
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-muse
      - user: agent:deleg-alex-muse
        relation: delegate
        object: user:alex
    check:
      - user: agent:deleg-alex-muse
        object: profile:bob
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false
      - user: agent:deleg-alex-muse
        object: profile:alex
        assertions:
          owner_agent: true
          contribute: true
          view_only_me: true
    list_objects:
      - user: agent:deleg-alex-muse
        type: profile
        assertions:
          view_only_me:
            - profile:alex

  - name: delegate without acts_for still derives owner_agent
    description: owner_agent is derived only through user#delegate; the owner's profile is reachable as soon as the delegate tuple exists, with no profile-specific write.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: agent:deleg-alex-muse
        relation: delegate
        object: user:alex
    check:
      - user: agent:deleg-alex-muse
        object: profile:alex
        assertions:
          owner_agent: true
          contribute: true
          view_only_me: true

  - name: delegate written before the profile exists
    description: The delegation (acts_for + delegate) predates the profile; writing only the owner tuple later grants the agent.
    tuples:
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-muse
      - user: agent:deleg-alex-muse
        relation: delegate
        object: user:alex
      - user: user:alex
        relation: owner
        object: profile:alex-later
    check:
      - user: agent:deleg-alex-muse
        object: profile:alex-later
        assertions:
          owner_agent: true
          contribute: true
          view_only_me: true

  - name: acts_for without delegate grants nothing
    description: acts_for alone (for example a stray tuple after a partial disconnect) gives no profile access.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:alex
        relation: acts_for
        object: agent:deleg-alex-muse
    check:
      - user: agent:deleg-alex-muse
        object: profile:alex
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false

  - name: sam's delegate on alex's profile
    description: A delegate tuple on Sam never grants on Alex's profile, even for the same OAuth client and even if it also acts_for alex.
    tuples:
      - user: user:alex
        relation: owner
        object: profile:alex
      - user: user:sam
        relation: owner
        object: profile:sam
      - user: agent:deleg-sam-muse
        relation: delegate
        object: user:sam
      - user: user:alex
        relation: acts_for
        object: agent:deleg-sam-muse
    check:
      - user: agent:deleg-sam-muse
        object: profile:alex
        assertions:
          owner_agent: false
          contribute: false
          view_only_me: false
      - user: agent:deleg-sam-muse
        object: profile:sam
        assertions:
          owner_agent: true
